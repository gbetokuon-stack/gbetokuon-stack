name: GitHub-Profile-3D-Contrib

on:
  # Tự động cập nhật mỗi ngày lúc 18:00 UTC
  schedule:
    - cron: "0 18 * * *"
  
  # Cho phép chạy thủ công từ tab Actions trên GitHub
  workflow_dispatch:
  
  # Chạy khi có commit mới đẩy lên nhánh main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Generate 3D Isometric Contribution Calendar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Tạo ma trận đồ họa 3D Isometric từ lịch sử đóng góp GitHub
      - name: Generate 3D Contribution Matrix
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # Tự động commit các file SVG 3D vào thư mục profile-3d-contrib/
      - name: Commit & Push 3D Calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --staged --quiet; then
            echo "Không có thay đổi mới để commit"
          else
            git commit -m "chore: update 3d contribution calendar [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
